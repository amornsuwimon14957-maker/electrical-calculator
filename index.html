<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>คำนวณขนาดสายไฟและ CB - HICRETE</title>

  <!-- Open Graph -->
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/6cm4rGx2/4528cdbf-cca0-4533-a4da-a0cc7048f529.jpg" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="คำนวณขนาดสายไฟและ CB - HICRETE" />
  <meta property="og:description" content="โปรแกรมคำนวณขนาดสายไฟและ Main CB มาตรฐาน วสท." />
  <meta property="og:image" content="https://i.ibb.co/6cm4rGx2/4528cdbf-cca0-4533-a4da-a0cc7048f529.jpg" />
  <meta property="og:url" content="https://electrical-calculator-hicrete.vercel.app/" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4 relative overflow-x-hidden bg-slate-950">

  <!-- Background Image & Overlay -->
  <div 
    class="fixed inset-0 bg-cover bg-center bg-no-repeat -z-10"
    style="background-image: url('https://wsrv.nl/?url=https://img2.pic.in.th/images-2b75e5d88945caa41.jpg');"
  ></div>
  <div class="fixed inset-0 bg-slate-950/75 backdrop-blur-[2px] -z-10"></div>

  <div class="max-w-md w-full space-y-4 my-8">

    <!-- Header Section -->
    <div class="text-center space-y-2">
      <div class="inline-block p-1.5 bg-slate-900/90 rounded-2xl shadow-2xl border border-slate-700/80 backdrop-blur-md">
        <img 
          src="https://i.ibb.co/6cm4rGx2/4528cdbf-cca0-4533-a4da-a0cc7048f529.jpg" 
          alt="HICRETE Logo" 
          class="w-24 h-auto rounded-xl object-cover block mx-auto"
        />
      </div>
      <h1 class="text-xl font-bold text-white flex items-center justify-center gap-2 pt-1 drop-shadow-md">
        <span class="text-yellow-400">⚡</span> คำนวณขนาดสายไฟ & CB
      </h1>
      <p class="text-xs text-slate-300 drop-shadow">วิเคราะห์พิกัดกระแสตามมาตรฐานการติดตั้งไฟฟ้า</p>
    </div>

    <!-- Main Card Input -->
    <div class="bg-slate-900/85 backdrop-blur-md p-5 rounded-2xl border border-slate-700/60 space-y-4 shadow-2xl">
      
      <!-- Load Type Switch -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button id="btnGeneral" onclick="setLoadType('general')" class="py-2.5 rounded-lg font-medium transition bg-blue-600 text-white shadow-lg shadow-blue-600/30">
          โหลดทั่วไป / แสงสว่าง
        </button>
        <button id="btnMotor" onclick="setLoadType('motor')" class="py-2.5 rounded-lg font-medium transition bg-slate-800/80 text-slate-300 hover:text-white">
          โหลดมอเตอร์ / แอร์
        </button>
      </div>

      <!-- Power Input -->
      <div>
        <label class="text-xs text-slate-200 block mb-1.5 font-medium">กำลังไฟฟ้า (กิโลวัตต์ / kW):</label>
        <input 
          type="number" 
          id="power" 
          value="3.5" 
          step="0.1"
          oninput="calculate()" 
          class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition"
        />
      </div>

      <!-- Phase Selection -->
      <div>
        <label class="text-xs text-slate-200 block mb-1.5 font-medium">ระบบไฟฟ้า (Phase):</label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button id="btnPhase1" onclick="setPhase('1')" class="py-2.5 rounded-lg transition bg-blue-600 text-white shadow-lg shadow-blue-600/30">
            1 เฟส (220V)
          </button>
          <button id="btnPhase3" onclick="setPhase('3')" class="py-2.5 rounded-lg transition bg-slate-800/80 text-slate-300 hover:text-white">
            3 เฟส (380V)
          </button>
        </div>
      </div>

      <!-- ชนิดสายไฟ และ จำนวนแกน -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-slate-200 block mb-1.5 font-medium">ชนิดสายไฟ:</label>
          <select id="wireType" onchange="updateOptions()" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
            <option value="THW">THW (IEC 01)</option>
            <option value="VAF">VAF</option>
            <option value="NYY">NYY</option>
          </select>
        </div>

        <div>
          <label class="text-xs text-slate-200 block mb-1.5 font-medium">จำนวนแกน:</label>
          <select id="wireCores" onchange="calculate()" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
            <option value="1">1 แกน (Single-Core)</option>
            <option value="2">2 แกน (2-Core)</option>
            <option value="3">3 แกน (3-Core)</option>
            <option value="4">4 แกน (4-Core)</option>
          </select>
        </div>
      </div>

      <!-- วิธีการเดินสาย -->
      <div>
        <label class="text-xs text-slate-200 block mb-1.5 font-medium">วิธีการเดินสาย:</label>
        <select id="installMethod" onchange="calculate()" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
          <option value="conduit">เดินในท่อร้อยสาย (Conduit)</option>
          <option value="air">เดินลอยในอากาศ / เกาะผนัง</option>
          <option value="underground">เดินฝังดินโดยตรง (Direct Buried)</option>
        </select>
      </div>

      <!-- Power Factor -->
      <div>
        <label class="text-xs text-slate-200 block mb-1.5 font-medium">Power Factor (PF):</label>
        <input 
          type="number" 
          id="pf" 
          value="0.85" 
          step="0.01" 
          oninput="calculate()" 
          class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition"
        />
      </div>
    </div>

    <!-- Result Card -->
    <div class="bg-slate-900/85 backdrop-blur-md p-5 rounded-2xl border border-slate-700/60 space-y-4 text-center shadow-2xl">
      <div class="text-xs text-slate-300 font-medium">📊 ผลการคำนวณ (มาตรฐาน วสท.)</div>
      
      <div>
        <div class="text-xs text-slate-400 mb-1">กระแสโหลดใช้งานจริง (I_load)</div>
        <div id="iLoad" class="text-3xl font-extrabold text-blue-400">0 A</div>
      </div>

      <div class="pt-3 border-t border-slate-800">
        <div class="text-xs text-slate-400 mb-1">ขนาด Main CB ที่แนะนำ (In)</div>
        <div id="cbSize" class="text-3xl font-extrabold text-red-500">0 A</div>
      </div>

      <div class="pt-3 border-t border-slate-800">
        <div class="text-xs text-slate-400 mb-1">ขนาดสายไฟที่แนะนำ</div>
        <div id="wireSize" class="text-2xl font-bold text-emerald-400">0 ตร.มม.</div>
        
        <div class="mt-2 inline-block px-3 py-1 bg-emerald-500/10 border border-emerald-500/30 rounded-lg">
          <span class="text-xs text-emerald-300">พิกัดทนกระแสสายไฟ (Iz): </span>
          <span id="wireCapacity" class="text-xs font-bold text-emerald-400">0 A</span>
        </div>

        <div id="wireDetail" class="text-xs text-slate-400 mt-2">-</div>
      </div>
    </div>

  </div>

  <script>
    let currentLoadType = 'general';
    let currentPhase = '1';

    // ตารางขนาดสายไฟและพิกัดทนกระแสมาตรฐาน (Iz) ตามวิธีเดินสาย
    const wireTable = [
      { size: "1.5", conduit: 15, air: 21, underground: 21 },
      { size: "2.5", conduit: 21, air: 29, underground: 29 },
      { size: "4",   conduit: 28, air: 38, underground: 38 },
      { size: "6",   conduit: 36, air: 49, underground: 49 },
      { size: "10",  conduit: 50, air: 68, underground: 68 },
      { size: "16",  conduit: 68, air: 91, underground: 91 },
      { size: "25",  conduit: 89, air: 121, underground: 121 },
      { size: "35",  conduit: 111, air: 150, underground: 150 },
      { size: "50",  conduit: 134, air: 183, underground: 183 }
    ];

    function setLoadType(type) {
      currentLoadType = type;
      document.getElementById('btnGeneral').className = type === 'general' 
        ? 'py-2.5 rounded-lg font-medium transition bg-blue-600 text-white shadow-lg shadow-blue-600/30' 
        : 'py-2.5 rounded-lg font-medium transition bg-slate-800/80 text-slate-300 hover:text-white';
      document.getElementById('btnMotor').className = type === 'motor' 
        ? 'py-2.5 rounded-lg font-medium transition bg-blue-600 text-white shadow-lg shadow-blue-600/30' 
        : 'py-2.5 rounded-lg font-medium transition bg-slate-800/80 text-slate-300 hover:text-white';
      calculate();
    }

    function setPhase(phase) {
      currentPhase = phase;
      document.getElementById('btnPhase1').className = phase === '1' 
        ? 'py-2.5 rounded-lg transition bg-blue-600 text-white shadow-lg shadow-blue-600/30' 
        : 'py-2.5 rounded-lg transition bg-slate-800/80 text-slate-300 hover:text-white';
      document.getElementById('btnPhase3').className = phase === '3' 
        ? 'py-2.5 rounded-lg transition bg-slate-800/80 text-slate-300 hover:text-white' 
        : 'py-2.5 rounded-lg transition bg-blue-600 text-white shadow-lg shadow-blue-600/30';
      updateOptions();
      calculate();
    }

    function updateOptions() {
      const type = document.getElementById('wireType').value;
      const method = document.getElementById('installMethod');

      if (type === 'VAF') {
        method.value = 'air';
        if (currentPhase === '3') {
          alert('สาย VAF ไม่รองรับระบบไฟฟ้า 3 เฟส');
          document.getElementById('wireType').value = 'THW';
        }
      }
      calculate();
    }

    function calculate() {
      const p = parseFloat(document.getElementById('power').value) || 0;
      const pfVal = parseFloat(document.getElementById('pf').value) || 0.85;
      const v = currentPhase === '1' ? 220 : 380;
      const wireType = document.getElementById('wireType').value;
      const method = document.getElementById('installMethod').value;
      const cores = document.getElementById('wireCores').value;

      // 1. คำนวณกระแสโหลดจริง (I_load)
      let iLoad = currentPhase === '1' 
        ? (p * 1000) / (v * pfVal)
        : (p * 1000) / (Math.sqrt(3) * v * pfVal);

      if (currentLoadType === 'motor') {
        iLoad = iLoad * 1.25;
      }

      // 2. หาขนาด CB (In >= 1.25 * I_load)
      const standardCBs = [10, 16, 20, 25, 32, 40, 50, 63, 80, 100, 125, 160, 200, 250];
      const targetCB = iLoad * 1.25;
      let cbSize = standardCBs.find(cb => cb >= targetCB) || Math.ceil(targetCB);

      // 3. หาขนาดสายไฟ (Iz >= In) บังคับให้พิกัดสายไฟทนกระแสได้มากกว่าเบรกเกอร์เสมอ
      let selectedWire = wireTable[wireTable.length - 1];
      for (let item of wireTable) {
        let capacity = item[method];
        if (capacity >= cbSize) {
          selectedWire = item;
          break;
        }
      }

      let methodText = "เดินในท่อร้อยสาย";
      if (method === 'air') methodText = "เดินลอยในอากาศ / เกาะผนัง";
      if (method === 'underground') methodText = "เดินฝังดินโดยตรง";

      document.getElementById('iLoad').innerText = iLoad.toFixed(2) + ' A';
      document.getElementById('cbSize').innerText = cbSize + ' A';
      document.getElementById('wireSize').innerText = selectedWire.size + ' ตร.มม.';
      document.getElementById('wireCapacity').innerText = selectedWire[method] + ' A';
      document.getElementById('wireDetail').innerText = `สาย ${wireType} (${cores} แกน) ${methodText}`;
    }

    calculate();
  </script>
</body>
</html>
